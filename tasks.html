<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="students.css">
</head>
<body>
    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <!-- Кнопка бургер-меню -->
            <button class="btn btn-dark d-lg-none me-3" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand" href="#">CMS</a>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link" href="#" role="button" data-bs-toggle="dropdown">
                            <img src="notification-icon.svg" alt="Сповіщення" class="bell-icon"> 
                            <span class="notification-dot"></span>
                        </a>
                        <ul class="dropdown-menu notification-dropdown">
                            <div class="notification-item unread">
                                <img src="profile-icon.svg" alt="User Icon" class="profile-icon">
                                <div class="notification-content">
                                    <p class="username"><em>John Doe</em></p>
                                    <p class="message">Liked a message</p>
                                </div>
                            </div>
                        </ul>
                    </li>
                    <li class="nav-item dropdown d-none d-lg-block">
                        <a class="nav-link profile-link" href="#" role="button" data-bs-toggle="dropdown">
                            <img src="profile-icon.svg" alt="Профіль" class="rounded-circle" width="30"> Johny Sins
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Виїжджаюче меню (Sidebar) -->
    <div class="offcanvas offcanvas-start text-bg-dark" id="sidebarMenu">
        <div class="offcanvas-header">
             <li class="nav-item dropdown d-none d-lg-block">
                        <a class="nav-link profile-link" href="#" role="button" data-bs-toggle="dropdown">
                            <img src="profile-icon.png" alt="Профіль" class="rounded-circle" width="30"> Johny Sins
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                    </li>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="students.html">Students</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="tasks.html">Tasks</a></li>
            </ul>
        </div>
    </div>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <!-- Бокове меню для великих екранів -->
            <nav class="col-md-2 d-none d-md-block sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link activeBtn" href="students.html">Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
                </ul>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <h2 class="mt-4">Tasks</h2>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="student.js"></script>
</body>
</html>
